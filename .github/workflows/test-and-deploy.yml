name: Test & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_builder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            resume-builder/backend/package-lock.json
            resume-builder/frontend/package-lock.json

      # Backend Tests
      - name: Install Backend Dependencies
        run: cd resume-builder/backend && npm ci

      - name: Build Backend
        run: cd resume-builder/backend && npm run build

      - name: Run Backend Tests
        run: cd resume-builder/backend && npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_builder_test
          JWT_SECRET: test-secret-key-minimum-32-characters-long
          GEMINI_API_KEY: test-key-value-for-ci

      # Frontend Tests
      - name: Install Frontend Dependencies
        run: cd resume-builder/frontend && npm ci

      - name: Install Playwright Browsers
        run: cd resume-builder/frontend && npx playwright install --with-deps

      - name: Run Frontend Tests
        run: cd resume-builder/frontend && npm test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: resume-builder/frontend/playwright-report/
          retention-days: 30

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to production environment..."
          # Placeholder for deployment logic (e.g., Vercel, Render, Railway CLI)
          # echo "Verifying deployment readiness..."
          # npm run deploy
