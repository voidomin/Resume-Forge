name: Test & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_builder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            resume-builder/backend/package-lock.json
            resume-builder/frontend/package-lock.json

      # Backend Tests
      - name: Install Backend Dependencies
        run: cd resume-builder/backend && npm ci

      - name: Build Backend
        run: cd resume-builder/backend && npm run build

      - name: Set Up Test Database Schema
        run: cd resume-builder/backend && npm run prisma:push:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_builder_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/resume_builder_test

      - name: Run Backend Tests
        run: cd resume-builder/backend && npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_builder_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/resume_builder_test
          JWT_SECRET: test-secret-key-minimum-32-characters-long
          GEMINI_API_KEY: test-key-value-for-ci

      # Frontend Tests
      - name: Install Frontend Dependencies
        run: cd resume-builder/frontend && npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./resume-builder/frontend/package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd resume-builder/frontend && npx playwright install --with-deps

      - name: Prepare Database & Start Backend
        run: |
          cd resume-builder/backend
          npx prisma db push --accept-data-loss
          nohup npx ts-node src/index.ts > backend.log 2>&1 &
          # Wait for backend to be ready
          echo "Waiting for backend on 127.0.0.1:3000..."
          for i in {1..20}; do
            if curl -s http://127.0.0.1:3000/health > /dev/null; then
              echo "✅ Backend is ready!"
              exit 0
            fi
            echo "Attempt $i: Still waiting..."
            sleep 3
          done
          echo "❌ Backend failed to start in time. Logs:"
          cat backend.log
          exit 1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_builder_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/resume_builder_test
          JWT_SECRET: test-secret-key-minimum-32-characters-long
          GEMINI_API_KEY: test-key-value-for-ci
          FRONTEND_URL: http://127.0.0.1:5173

      - name: Run Frontend Tests
        run: cd resume-builder/frontend && npm test

      - name: Print Backend Logs on Failure
        if: failure()
        run: |
          if [ -f resume-builder/backend/backend.log ]; then
            echo "--- Backend Logs ---"
            cat resume-builder/backend/backend.log
          else
            echo "Backend log file not found."
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: resume-builder/frontend/playwright-report/
          retention-days: 30

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to production environment..."
          # Placeholder for deployment logic (e.g., Vercel, Render, Railway CLI)
          # echo "Verifying deployment readiness..."
          # npm run deploy
